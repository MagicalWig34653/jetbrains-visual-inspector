name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repository and agent setup
        run: npm run check:repo
      - name: Secret scan
        run: npm run check:secrets
      - name: Hook tests
        run: npm run test:hooks
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: TypeScript tests
        run: npm test

  plugin:
    name: Plugin build, tests and verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Free disk space for IDE downloads
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build inspector bundle (packaged into the plugin)
        working-directory: .
        run: |
          npm ci
          npm run build:inspector -w browser-extension
      - name: Build and test
        run: ./gradlew build
      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin
